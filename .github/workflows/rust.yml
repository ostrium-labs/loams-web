name: Rust port

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 conformance/check.py
      - run: python3 -m unittest discover -s conformance -p 'test_*.py'
      - run: cargo build --locked -p bill-split
      - run: python3 conformance/run_rust.py --binary target/debug/bill-split --output /tmp/loams-web-rust-observations.json
      - run: python3 conformance/check.py --observations /tmp/loams-web-rust-observations.json
      - run: cargo check --locked -p loams-web --no-default-features
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
