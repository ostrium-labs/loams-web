name: Rust port

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      - run: bun test
        working-directory: web
      - run: bun run build
        working-directory: web
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          version: 29.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: python3 conformance/check.py
      - run: python3 -m unittest discover -s conformance -p 'test_*.py'
      - run: cargo build --locked -p bill-split -p loams-web-cli
      - run: target/debug/loams-web-cli new /tmp/loams-web-scaffold --name scaffold-smoke --framework-path .
      - run: cargo check --offline --manifest-path /tmp/loams-web-scaffold/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - run: python3 conformance/run_rust.py --binary target/debug/bill-split --output /tmp/loams-web-rust-observations.json
      - run: python3 conformance/check.py --observations /tmp/loams-web-rust-observations.json --require-executed-kind split
      - run: cargo check --locked -p loams-web --no-default-features
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
