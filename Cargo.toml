[workspace]
resolver = "2"
members = [
    "crates/loams-web",
    "crates/loams-web-core",
    "crates/loams-web-http",
    "crates/loams-web-openapi",
    "crates/loams-web-cli",
    "crates/loams-web-derive",
    "crates/loams-web-rpc",
    "crates/loams-web-platform",
    "examples/bill-split",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
loams-web = { path = "crates/loams-web" }
loams-web-core = { path = "crates/loams-web-core" }
loams-web-http = { path = "crates/loams-web-http" }
loams-web-openapi = { path = "crates/loams-web-openapi" }
loams-web-cli = { path = "crates/loams-web-cli" }
loams-web-derive = { path = "crates/loams-web-derive" }
loams-web-rpc = { path = "crates/loams-web-rpc" }
loams-web-platform = { path = "crates/loams-web-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
jsonschema = { version = "=0.30.0", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
thiserror = "2"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
bytes = "1"
connectrpc = { version = "=0.9.1", default-features = false, features = ["axum", "json", "gzip"] }
buffa = { version = "=0.9.2", features = ["json"] }
connectrpc-build = "=0.9.0"
protox = "=0.10.0"
prost = "0.14"
