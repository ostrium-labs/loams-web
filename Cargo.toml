[workspace]
resolver = "2"
members = [
    "crates/loams-web",
    "crates/loams-web-core",
    "crates/loams-web-http",
    "crates/loams-web-openapi",
    "crates/loams-web-cli",
    "examples/bill-split",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
loams-web = { path = "crates/loams-web" }
loams-web-core = { path = "crates/loams-web-core" }
loams-web-http = { path = "crates/loams-web-http" }
loams-web-openapi = { path = "crates/loams-web-openapi" }
loams-web-cli = { path = "crates/loams-web-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
jsonschema = { version = "=0.30.0", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
thiserror = "2"
